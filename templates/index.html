<!DOCTYPE html>
<html>
<head>
<title>EduGenie - AI Study Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial; max-width:800px; margin:20px auto; padding:15px; background:#f0f2f5;}
.card{background:white; padding:20px; border-radius:12px; margin-bottom:15px; box-shadow:0 2px 8px #ccc;}
button{background:#6c5ce7; color:white; border:none; padding:10px 18px; border-radius:6px; cursor:pointer; margin:5px; font-size:15px;}
button:hover{background:#5a4bd1;}
input, textarea{width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:6px; box-sizing:border-box;}
.tab{overflow:hidden; background:white; border-radius:10px 10px 0 0; display:flex;}
.tab button{flex:1; background:#ddd; color:black; border-radius:0;}
.tab button.active{background:#6c5ce7; color:white;}
.tabcontent{display:none; padding:20px; background:white; border-radius:0 0 10px 10px;}
#answer, #quiz-box, #summary-box{white-space:pre-wrap; background:#eef2ff; padding:15px; border-radius:8px; min-height:50px; margin-top:10px;}
</style>
</head>
<body>
<h1>🎓 EduGenie - AI Study Assistant</h1>

<div class="card">
<h3>📄 Upload Document</h3>
<input type="file" id="file-input" accept=".pdf,.txt,.docx">
<button onclick="uploadFile()">Upload</button>
<p id="upload-status"></p>
</div>

<div class="tab">
<button class="tablinks active" onclick="openTab(event,'Chat')">💬 Chat</button>
<button class="tablinks" onclick="openTab(event,'Quiz')">📝 Quiz</button>
<button class="tablinks" onclick="openTab(event,'Summary')">📚 Summary</button>
</div>

<div id="Chat" class="tabcontent" style="display:block;">
<h3>Ask Anything</h3>
<input type="text" id="question" placeholder="Ask from document or any general question...">
<button onclick="askQuestion()">Ask AI</button>
<div id="answer">Answer will appear here...</div>
</div>

<div id="Quiz" class="tabcontent">
<h3>Generate Quiz</h3>
<button onclick="generateQuiz()">Generate 5 Questions</button>
<div id="quiz-box">Quiz will appear here...</div>
</div>

<div id="Summary" class="tabcontent">
<h3>Document Summary</h3>
<button onclick="generateSummary()">Summarize Document</button>
<div id="summary-box">Summary will appear here...</div>
</div>

<script>
function openTab(evt, name){
  document.querySelectorAll(".tabcontent").forEach(c=>c.style.display="none");
  document.querySelectorAll(".tablinks").forEach(b=>b.classList.remove("active"));
  document.getElementById(name).style.display="block";
  evt.currentTarget.classList.add("active");
}
async function uploadFile(){
  const f=document.getElementById('file-input').files[0];
  if(!f){alert('Select file');return;}
  const fd=new FormData(); fd.append('file',f);
  document.getElementById('upload-status').innerText='⏳ Uploading...';
  try{
    const res=await fetch('/upload',{method:'POST',body:fd});
    const data=await res.json();
    document.getElementById('upload-status').innerText=data.success?'✅ '+data.message:'❌ '+data.message;
  }catch(e){document.getElementById('upload-status').innerText='❌ Failed';}
}
async function askQuestion(){
  const q=document.getElementById('question').value;
  if(!q){alert('Enter question');return;}
  document.getElementById('answer').innerText='⏳ Thinking...';
  try{
    const res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});
    const data=await res.json();
    document.getElementById('answer').innerText=data.response||data.answer||data.message||JSON.stringify(data);
  }catch(e){document.getElementById('answer').innerText='❌ Error: '+e;}
}
async function generateQuiz(){
  document.getElementById('quiz-box').innerText='⏳ Generating Quiz...';
  try{
    const res=await fetch('/quiz',{method:'POST'});
    const data=await res.json();
    document.getElementById('quiz-box').innerText=data.quiz||data.response||data.message||JSON.stringify(data);
  }catch(e){document.getElementById('quiz-box').innerText='❌ Error: '+e;}
}
async function generateSummary(){
  document.getElementById('summary-box').innerText='⏳ Summarizing...';
  try{
    const res=await fetch('/summary',{method:'POST'});
    const data=await res.json();
    document.getElementById('summary-box').innerText=data.summary||data.response||data.message||JSON.stringify(data);
  }catch(e){document.getElementById('summary-box').innerText='❌ Error: '+e;}
}
</script>
</body>
</html>
