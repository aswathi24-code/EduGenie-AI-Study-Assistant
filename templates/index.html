<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduGenie - AI Learning Assistant</title>
<style>
body { font-family: Arial; max-width: 800px; margin: auto; padding: 20px; background: #f5f5f5; }
header { background: #4a6cf7; color: white; padding: 20px; text-align: center; border-radius: 10px; }
.card { background: white; padding: 20px; margin: 20px 0; border-radius: 10px; box-shadow: 0 2px 5px #ccc; }
button { background: #4a6cf7; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
button:hover { background: #3a5ce5; }
input[type="file"] { margin: 10px 0; }
#status { margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>

<header class="header">
<h1>📚 EduGenie</h1>
<p>AI Learning Assistant for TNPSC & All Exams</p>
</header>

<div class="card">
<h3>📤 Upload Document</h3>
<form id="upload-form">
<input type="file" id="file-input" name="file" accept=".pdf,.txt" required>
<button type="submit">Upload Document</button>
</form>
<p id="upload-status"></p>
<p id="file-name-display"></p>
</div>

<div class="card">
<h3>💬 Ask Question</h3>
<input type="text" id="question" placeholder="Ask anything from your document..." style="width:70%; padding:10px;">
<button onclick="askQuestion()">Ask</button>
<div id="answer" style="margin-top:15px;"></div>
</div>

<div class="card">
<button onclick="clearDocs()">🗑️ Clear All Documents</button>
<button onclick="useSample()">📄 Use Sample Document</button>
</div>

<script>
// File name display
document.querySelector('input[type="file"]').addEventListener('change', function(){
  if(this.files && this.files[0]){
    document.getElementById('file-name-display').innerHTML = '✅ Selected: ' + this.files[0].name;
    document.getElementById('file-name-display').style.color = 'green';
  }
});

// Upload
document.getElementById('upload-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const fileInput = document.getElementById('file-input');
  if(!fileInput.files[0]){ alert('Please select a file'); return; }
  const fd = new FormData();
  fd.append('file', fileInput.files[0]);
  document.getElementById('upload-status').innerText = '⏳ Uploading... Please wait...';
  try{
    const res = await fetch('/upload', {method:'POST', body:fd});
    const data = await res.json();
    if(data.success){
      document.getElementById('upload-status').innerText = '✅ ' + data.message + ' - ' + data.characters + ' chars';
      alert('Success: ' + data.filename + ' uploaded!');
    }else{
      document.getElementById('upload-status').innerText = '❌ ' + data.message;
      alert('Error: ' + data.message);
    }
  }catch(err){
    document.getElementById('upload-status').innerText = '❌ Failed: ' + err;
    alert('Upload failed');
  }
});

async function askQuestion(){
  const q = document.getElementById('question').value;
  if(!q){ alert('Enter question'); return; }
  document.getElementById('answer').innerText = '⏳ Thinking...';
  const res = await fetch('/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({question:q})});
  const data = await res.json();
  document.getElementById('answer').innerText = data.answer || data.message;
}

async function clearDocs(){
  if(!confirm('Clear all docs?')) return;
  const res = await fetch('/clear', {method:'POST'});
  const data = await res.json();
  alert(data.message);
}

async function useSample(){
  const res = await fetch('/use-sample', {method:'POST'});
  const data = await res.json();
  alert(data.message);
}
</script>

</body>
</html>
